name: Jessie verified installable APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jessi-verified
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload intermediary APK for offline signing ONLY
        uses: actions/upload-artifact@v4
        with:
          name: Jessi-Preview-v0.11.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 5

      - name: Locate stable signature
        id: signed
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -f "signing/v$VERSION.sigblock.b64" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No permanent signature for version $VERSION; APK publication blocked." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply the permanent signing block
        if: steps.signed.outputs.ready == 'true'
        run: |
          python3 scripts/apply_signature_block.py \
            app/build/outputs/apk/debug/app-debug.apk \
            signing/v${{ steps.signed.outputs.version }}.sigblock.b64 \
            app/build/outputs/apk/signed/Jessi.apk

      - name: Verify APK signature and original app identity
        if: steps.signed.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/signed/Jessi.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=0c8b4868394b2b1a5e8e3c29c95b9e4556bfbcfa4a1966f4260a880cb8fdb6d5
          [[ "$CERT_SHA" == "$EXPECTED" ]] || { echo "::error::Wrong APK signing certificate"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='ir.jessi.finance' "
          echo "Stable signature and identity verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify actual Android 13 installation and app launch
        if: steps.signed.outputs.ready == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/test_android_install.sh

      - name: Verify preview install and app startup on Android 13
        if: steps.signed.outputs.ready != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/test_android_preview.sh

      - name: Publish safe side-by-side preview APK
        if: steps.signed.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.signed.outputs.version }}"
          TAG="v${VERSION}-preview"
          FILE="Jessi-v${VERSION}-preview.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview release already exists; do not overwrite."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
            --title "جسی ${VERSION} — نسخه آزمایشی" \
            --notes "نسخه آزمایشی با شناسه ir.jessi.finance.preview؛ کنار برنامه اصلی نصب می‌شود و داده‌های نسخه اصلی را تغییر نمی‌دهد. برای انتقال آزمایشی اطلاعات، ابتدا از نسخه اصلی فایل پشتیبان بگیرید و در این نسخه از تنظیمات بازیابی کنید. این فایل جایگزین مستقیم نسخه امضاشده اصلی نیست."

      - name: Release the verified APK only
        if: steps.signed.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.signed.outputs.version }}"
          TAG="v$VERSION"
          FILE="Jessi-v$VERSION.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release unchanged; no silent overwrites."
            exit 0
          fi
          cp app/build/outputs/apk/signed/Jessi.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "جسی $VERSION" \
            --notes "APK با امضای ثابت جسی که apksigner آن را تأیید کرده و نصب و اجرا روی شبیه‌ساز Android 13 تست شده است. نسخه‌های Debug قدیمی ممکن است برای مهاجرت یک‌باره به نسخه امضاشده نیاز به پشتیبان‌گیری داشته باشند."
