name: Jessie Official Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Check permanent signing setup
        id: signing
        env:
          SIGNING_BUNDLE: ${{ secrets.JESSI_SIGNING_BUNDLE }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### One-time signing setup required" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the JESSI_SIGNING_BUNDLE repository secret before the first official APK can be published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore permanent signing key privately
        if: steps.signing.outputs.ready == 'true'
        env:
          SIGNING_BUNDLE: ${{ secrets.JESSI_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64
          bundle = json.loads(os.environ["SIGNING_BUNDLE"])
          raw = base64.b64decode(bundle["keystore_b64"], validate=True)
          if len(raw) < 1024 or len(raw) > 64_000:
              raise ValueError("Invalid signing keystore data")
          path = os.path.join(os.environ["RUNNER_TEMP"], "jessi-release-signing.p12")
          with open(path, "wb") as f:
              f.write(raw)
          os.chmod(path, 0o600)
          values = {
              "JESSI_SIGNING_STORE_FILE": path,
              "JESSI_SIGNING_STORE_PASSWORD": bundle["store_password"],
              "JESSI_SIGNING_KEY_ALIAS": bundle["key_alias"],
              "JESSI_SIGNING_KEY_PASSWORD": bundle["key_password"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise ValueError("Invalid signing value")
                  env.write(f"{key}={value}\n")
          PY

      - name: Build the only public APK (signed release)
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify permanent signer and package signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=0c8b4868394b2b1a5e8e3c29c95b9e4556bfbcfa4a1966f4260a880cb8fdb6d5
          if [[ "$CERT_SHA" != "$EXPECTED" ]]; then
            echo "::error::APK signing certificate changed unexpectedly!"
            exit 1
          fi

      - name: Publish one official GitHub Release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          TAG="v${VERSION}"
          FILE="Jessi-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. It will not be silently overwritten."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "جسی نسخه ${VERSION}" \
            --notes "نسخه رسمی جسی با امضای ثابت برای آپدیت‌های بعدی روی همین برنامه. هر نسخه جدید باید versionCode بزرگ‌تر و همان امضای ثابت را داشته باشد."
          echo "### Published $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "The APK uses the official ir.jessi.finance package and permanent signing certificate." >> "$GITHUB_STEP_SUMMARY"
