name: Jessie Android v0.11 APK and permanent-signing verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jessi-official
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compile official app and run tests
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Choose a verified official signing method
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.JESSI_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -f "signing/v${VERSION}.sigblock.b64" ]]; then
            echo "method=offline-block" >> "$GITHUB_OUTPUT"
            echo "Offline signature block found for v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$SIGNING_BUNDLE" ]]; then
            echo "method=private-key" >> "$GITHUB_OUTPUT"
            echo "The owner's private signing bundle is available to CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "method=temporary" >> "$GITHUB_OUTPUT"
            echo "::warning::No original signing key is available. The output will use the original package ID but a different temporary signing key. It CANNOT update an existing Jessie installation. Back up data before migration."
            echo "Original-package temporary-signed APK: NOT an in-place update. Existing installs remain untouched." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply the precomputed permanent signature
        if: steps.signing.outputs.method == 'offline-block'
        run: |
          python3 scripts/apply_signature_block.py \
            app/build/outputs/apk/debug/app-debug.apk \
            signing/v${{ steps.signing.outputs.version }}.sigblock.b64 \
            app/build/outputs/apk/signed/Jessi.apk

      - name: Restore permanent signing key privately on runner
        if: steps.signing.outputs.method == 'private-key'
        env:
          SIGNING_BUNDLE: ${{ secrets.JESSI_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64
          bundle = json.loads(os.environ["SIGNING_BUNDLE"])
          raw = base64.b64decode(bundle["keystore_b64"], validate=True)
          if len(raw) < 1024 or len(raw) > 64000:
              raise ValueError("Invalid signing keystore size")
          path = os.path.join(os.environ["RUNNER_TEMP"], "jessi-release-signing.p12")
          with open(path, "wb") as f:
              f.write(raw)
          os.chmod(path, 0o600)
          values = {
              "JESSI_SIGNING_STORE_FILE": path,
              "JESSI_SIGNING_STORE_PASSWORD": bundle["store_password"],
              "JESSI_SIGNING_KEY_ALIAS": bundle["key_alias"],
              "JESSI_SIGNING_KEY_PASSWORD": bundle["key_password"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise ValueError("Invalid signing value")
                  env.write(f"{key}={value}\n")
          PY

      - name: Build with the owner's permanent private signer
        if: steps.signing.outputs.method == 'private-key'
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p app/build/outputs/apk/signed
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/signed/Jessi.apk

      - name: Verify signature matches previous official releases
        if: steps.signing.outputs.method != 'temporary'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/signed/Jessi.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=0c8b4868394b2b1a5e8e3c29c95b9e4556bfbcfa4a1966f4260a880cb8fdb6d5
          [[ "$CERT_SHA" == "$EXPECTED" ]] || { echo "::error::Signing certificate differs from v0.10.0"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='ir.jessi.finance' "
          echo "Same app ID and permanent signing certificate verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test install over previous official v0.10.0 and launch
        if: steps.signing.outputs.method != 'temporary'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/test_android_install.sh

      - name: Verify temporary signer and original package identity
        if: steps.signing.outputs.method == 'temporary'
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='ir.jessi.finance' "
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "versionCode='17'"
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=0c8b4868394b2b1a5e8e3c29c95b9e4556bfbcfa4a1966f4260a880cb8fdb6d5
          [[ "$CERT_SHA" != "$EXPECTED" ]] || { echo "::error::Unexpected signer, check release path"; exit 1; }
          echo "Original app ID verified. Temporary signature verified and documented; NOT compatible with in-place upgrades." >> "$GITHUB_STEP_SUMMARY"

      - name: Test temporary-signed original-package APK on Android 13
        if: steps.signing.outputs.method == 'temporary'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/test_android_original_package.sh

      - name: Release only the official verified APK
        if: steps.signing.outputs.method != 'temporary'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.signing.outputs.version }}"
          TAG="v${VERSION}"
          FILE="Jessi-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official release already exists; refusing silent overwrite." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp app/build/outputs/apk/signed/Jessi.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "جسی ${VERSION}" \
            --notes "نسخه رسمی با شناسه ir.jessi.finance و گواهی امضای یکسان با v0.10.0. نصب و آپدیت درجا از نسخه قبلی روی Android 13 تست شده؛ قبل از هر آپدیت مهم، از اطلاعات مالی پشتیبان بگیرید."
          echo "Published signed Jessie v${VERSION}." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Jessi 0.11 installable APK with explicit signature warning
        if: steps.signing.outputs.method == 'temporary'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.signing.outputs.version }}"
          TAG="v${VERSION}"
          FILE="Jessi-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite."
            exit 0
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" \
            --title "جسی ${VERSION} — APK با شناسه اصلی" \
            --notes "نسخه 0.11 با نام جسی و شناسه اصلی ir.jessi.finance است، اما به علت در دسترس نبودن کلید امضای دائمی، با کلید موقت امضا شده است. این فایل روی نسخه رسمی 0.10 به صورت آپدیت مستقیم نصب نمی‌شود. برنامه اصلی را بدون گرفتن نسخه پشتیبان داده‌های مالی حذف نکنید. برای مهاجرت ابتدا داخل جسی فعلی از تنظیمات پشتیبان تهیه کرده، سپس پس از اطمینان از سلامت فایل پشتیبان اقدام به نصب مجدد و بازیابی کنید. پس از بازیابی، اطلاعات را بررسی کنید. تست نصب تازه و اجرا روی شبیه‌ساز اندروید 13 انجام شده است؛ تست آپدیت درجا موفق یا ادعا نشده است. این مسیر امضا برای آپدیت‌های آینده مناسب نیست؛ امضای اصلی باید بازیابی شود."
          echo "Published v${VERSION} original-package APK with documented temporary-signature limitation." >> "$GITHUB_STEP_SUMMARY"
