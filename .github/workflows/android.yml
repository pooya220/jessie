name: Jessie permanent-signed official APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: jessi-official
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compile official app and run tests
        run: |
          gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest

      # v0.11.14 was signed against the archived, exact Release output.
      # Verify the original SHA-256 before applying its public APK signature.
      # This never handles private signing material and never relaxes signature checks.
      - name: Restore checksum-locked original 0.11.14 Release input
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [[ "$VERSION" == "0.11.14" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 43760821344 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-ed7ef3a89986442de10ab0712a79afde7eb9047c \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              47f2a2c4afaf14d7d65654492e958db14b7df9449a31e683583d3b5cccc2eb45 \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored the exact, SHA-256 pinned release input for 0.11.14." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$VERSION" == "0.11.15" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 43764080276 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-733f614c3432ca97fd0ab7d02931b854798a2a0a \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              260dace26c972bd8214af8124ad1cc1b74f61259026ccc6b71105c37e150cb65 \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored SHA-256 pinned original release input for 0.11.15." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$VERSION" == "0.11.16" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 43814690295 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-44ecbbf9617113e0d5b8b3652d5d8a5d92047696 \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              df3c24aef7aefa221ff2ce89780ef5f7d72cad3e75f62635679a3a6b3d6add37 \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored SHA-256 pinned original release input for 0.11.16." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$VERSION" == "0.11.17" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 44766973271 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-c13c9e481b4bd89322937739c35d7d74fea4cb80 \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              804f068d89ce95fae84ce1fe3f32d425f463bdf71d8660b9d40084e322e7e425 \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored SHA-256 pinned original release input for 0.11.17." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$VERSION" == "0.11.18" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 44770279403 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-6e1fcd8403136adf5aa5897f39e454b7702d03f1 \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              f557553da4df408eec38f2e6b88e522f536a3bb15974ca6194fa7d71c43e52ac \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored SHA-256 pinned original release input for 0.11.18." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$VERSION" == "0.11.19" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 45076779811 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-1e2cee94881999bfdeebcea30bc4cb4da75470d4 \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              f99c280529af3eeaffb3a781cad26a79022e76df25567cb25b44ae13abb067fd \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored SHA-256 pinned original release input for 0.11.19." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$VERSION" == "0.11.20" ]]; then
            mkdir -p "$RUNNER_TEMP/jessi-verified-input"
            gh run download 45078429809 \
              --repo "$GITHUB_REPOSITORY" \
              --name jessi-signing-input-b3e09eeebeec85473645772419d44bbe61c56abe \
              --dir "$RUNNER_TEMP/jessi-verified-input"
            test -s "$RUNNER_TEMP/jessi-verified-input/app-release.apk"
            printf '%s  %s\n' \
              f37af821d2ec65a3a0d6818015b6b8104ca5e185b8f8f2016894cc69266def13 \
              "$RUNNER_TEMP/jessi-verified-input/app-release.apk" | sha256sum --check --status
            cp "$RUNNER_TEMP/jessi-verified-input/app-release.apk" \
              app/build/outputs/apk/release/app-release.apk
            echo "Restored SHA-256 pinned original release input for 0.11.20." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save APK signing input for offline permanent signer
        uses: actions/upload-artifact@v4
        with:
          name: jessi-signing-input-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 2

      - name: Choose a verified official signing method
        id: signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.JESSI_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -f "signing/v${VERSION}.sigblock.b64" ]]; then
            echo "method=offline-block" >> "$GITHUB_OUTPUT"
            echo "Offline signature block found for v${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -n "$SIGNING_BUNDLE" ]]; then
            echo "method=private-key" >> "$GITHUB_OUTPUT"
            echo "The owner's private signing bundle is available to CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Permanent signing key is not available. Set GitHub secret JESSI_SIGNING_BUNDLE. Never publish temporary-signed Jessie APKs."
            exit 1
          fi

      - name: Apply the precomputed permanent signature
        if: steps.signing.outputs.method == 'offline-block'
        run: |
          python3 scripts/apply_signature_block.py \
            app/build/outputs/apk/release/app-release.apk \
            signing/v${{ steps.signing.outputs.version }}.sigblock.b64 \
            app/build/outputs/apk/signed/Jessi.apk

      - name: Restore permanent signing key privately on runner
        if: steps.signing.outputs.method == 'private-key'
        env:
          SIGNING_BUNDLE: ${{ secrets.JESSI_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, base64
          bundle = json.loads(os.environ["SIGNING_BUNDLE"])
          raw = base64.b64decode(bundle["keystore_b64"], validate=True)
          if len(raw) < 1024 or len(raw) > 64000:
              raise ValueError("Invalid signing keystore size")
          path = os.path.join(os.environ["RUNNER_TEMP"], "jessi-release-signing.p12")
          with open(path, "wb") as f:
              f.write(raw)
          os.chmod(path, 0o600)
          values = {
              "JESSI_SIGNING_STORE_FILE": path,
              "JESSI_SIGNING_STORE_PASSWORD": bundle["store_password"],
              "JESSI_SIGNING_KEY_ALIAS": bundle["key_alias"],
              "JESSI_SIGNING_KEY_PASSWORD": bundle["key_password"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise ValueError("Invalid signing value")
                  env.write(f"{key}={value}\n")
          PY

      - name: Build with the owner's permanent private signer
        if: steps.signing.outputs.method == 'private-key'
        run: |
          gradle --no-daemon :app:assembleRelease
          mkdir -p app/build/outputs/apk/signed
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/signed/Jessi.apk

      - name: Verify signature matches previous official releases
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/signed/Jessi.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          EXPECTED=e5595361238d05ea6aa34199d19530dc5610a47202a930dcba61e748b47e6559
          [[ "$CERT_SHA" == "$EXPECTED" ]] || { echo "::error::Signing certificate differs from the NEW permanent Jessie signing identity"; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "^package: name='ir.jessi.finance' "
          echo "New permanent signing certificate and original package ID verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test install and upgrade with the new permanent signing identity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash scripts/test_android_permanent.sh

      - name: Release only the NEW permanently signed official APK
        if: steps.signing.outputs.method != 'temporary'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.signing.outputs.version }}"
          TAG="v${VERSION}"
          FILE="Jessi-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Official release already exists; refusing silent overwrite." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp app/build/outputs/apk/signed/Jessi.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "جسی ${VERSION} — امضای دائمی" \
            --notes "جسی با شناسه اصلی ir.jessi.finance و کلید امضای دائمی جدید. از 0.10.0 و 0.11.0 با امضای متفاوت، آپدیت مستقیم ممکن نیست؛ ابتدا بکاپ و بازیابی یک‌باره لازم است. از 0.11.1 به بعد تمامی نسخه‌ها باید با همین کلید ثابت منتشر شوند. نصب و اجرای نسخه جدید روی شبیه‌ساز Android 13 تأیید شده است."
          echo "Published signed Jessie v${VERSION}." >> "$GITHUB_STEP_SUMMARY"

