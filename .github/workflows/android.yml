name: Build Jessi APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -1)
          echo "SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace --info :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Jessi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          TAG="v${VERSION}"
          FILE="Jessi-v${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publication."
          else
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" \
              --title "جسی ${VERSION}" \
              --notes "فایل APK جسی. هشدار: کلید Debug در هر بیلد ممکن است عوض شود و نصب روی نسخه قبلی می‌تواند با خطای Conflict مواجه شود. اگر داده مالی مهم داری، نسخه قبلی را بدون تهیه پشتیبان حذف نکن."
          fi
