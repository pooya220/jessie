name: Verify Jessie Android changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Jessie and run unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Verify matching official APK signature
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_signature_block.py app/build/outputs/apk/debug/app-debug.apk signing/v0.11.8.sigblock.b64 app/build/outputs/apk/signed/Jessi-v0.11.8.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --min-sdk-version 26 app/build/outputs/apk/signed/Jessi-v0.11.8.apk
          CERT_SHA=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/signed/Jessi-v0.11.8.apk | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          test "$CERT_SHA" = "e5595361238d05ea6aa34199d19530dc5610a47202a930dcba61e748b47e6559"
      - name: Upload verified stable-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: jessi-verified-signed-${{ github.sha }}
          path: app/build/outputs/apk/signed/Jessi-v0.11.8.apk
          if-no-files-found: error
          retention-days: 2
